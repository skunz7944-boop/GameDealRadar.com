<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Deal Radar - Key-Vergleich</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #0b1426;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 2.5rem;
            color: #38bdf8;
            margin-bottom: 5px;
        }
        .search-box {
            width: 100%;
            max-width: 500px;
            margin-bottom: 25px;
        }
        input {
            width: 100%;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #1e293b;
            background-color: #1e293b;
            color: white;
            font-size: 1.1rem;
            box-sizing: border-box;
        }
        .shop-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            max-width: 500px;
        }
        .shop-button {
            padding: 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            text-align: center;
            cursor: pointer;
            border: none;
            color: white;
            transition: transform 0.2s;
        }
        .shop-button:hover {
            transform: scale(1.05);
        }
        /* Farben für die jeweiligen Shops */
        .eneba { background-color: #5d1f87; }
        .instant { background-color: #ff5400; }
        .mmoga { background-color: #31572c; }
        .kinguin { background-color: #1a73e8; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎮 Game Deal Radar</h1>
        <p>Tippe ein Spiel ein und vergleiche die Key-Shops</p>
    </div>

    <div class="search-box">
        <input type="text" id="gameSearch" placeholder="Spielname eingeben (z.B. GTA)...">
    </div>

    <div class="shop-grid">
        <button class="shop-button eneba" onclick="searchInShop('eneba')">Auf Eneba suchen</button>
        <button class="shop-button instant" onclick="searchInShop('instant')">Auf Instant Gaming</button>
        <button class="shop-button mmoga" onclick="searchInShop('mmoga')">Auf MMOGA suchen</button>
        <button class="shop-button kinguin" onclick="searchInShop('kinguin')">Auf Kinguin suchen</button>
    </div>

    <script>
        function searchInShop(shop) {
            const query = encodeURIComponent(document.getElementById('gameSearch').value);
            
            if (!query) {
                alert("Bitte gib zuerst einen Spielnamen ein!");
                return;
            }

            let url = "";

            if (shop === 'eneba') {
                url = `https://www.eneba.com/store/all?text=${query}`;
            } else if (shop === 'instant') {
                url = `https://www.instant-gaming.com/de/suche/?q=${query}`;
            } else if (shop === 'mmoga') {
                url = `https://www.mmoga.de/advanced_search_result.php?keywords=${query}`;
            } else if (shop === 'kinguin') {
                url = `https://www.kinguin.net/de/catalogsearch/result?q=${query}`;
            }

            // Öffnet die Suche des jeweiligen Shops in einem neuen Tab
            window.open(url, '_blank');
        }
    </script>
</body>

</html>
