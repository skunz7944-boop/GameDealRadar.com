<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Deal Radar - Top Deals</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #0b1426;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 2.5rem;
            color: #38bdf8;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
            margin-bottom: 5px;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 1rem;
        }
        .results-list {
            width: 100%;
            max-width: 550px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .deal-card {
            background-color: #1e293b;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #334155;
            transition: transform 0.2s;
        }
        .deal-card:hover {
            transform: scale(1.02);
            border-color: #38bdf8;
        }
        .deal-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .game-title {
            font-weight: bold;
            font-size: 1.1rem;
            color: #f8fafc;
        }
        .savings-badge {
            background-color: #ef4444;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            width: fit-content;
        }
        .price-container {
            text-align: right;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .retail-price {
            text-decoration: line-through;
            color: #64748b;
            font-size: 0.9rem;
        }
        .price-tag {
            background-color: #22c55e;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎮 Game Deal Radar</h1>
        <p class="subtitle">Die heißesten Gaming-Deals aktuell live im Netz</p>
    </div>

    <div id="results" class="results-list">
        <p style="text-align:center; color:#94a3b8;">Radar scannt den Markt nach Deals...</p>
    </div>

    <script>
        // Diese Funktion läuft AUTOMATISCH, sobald die Seite lädt
        window.onload = async function() {
            const resultsDiv = document.getElementById('results');
            
            try {
                // Holt automatisch die Top 10 Deals sortiert nach den besten Ersparnissen
                const response = await fetch(`https://www.cheapshark.com/api/1.0/deals?pageSize=10&sortBy=Savings`);
                const deals = await response.json();
                
                resultsDiv.innerHTML = '';
                
                if (deals.length === 0) {
                    resultsDiv.innerHTML = '<p style="text-align:center; color:#94a3b8;">Gerade keine Deals verfügbar.</p>';
                    return;
                }
                
                deals.forEach(deal => {
                    const card = document.createElement('div');
                    card.className = 'deal-card';
                    card.innerHTML = `
                        <div class="deal-info">
                            <span class="game-title">${deal.title}</span>
                            <span class="savings-badge">-${Math.round(deal.savings)}%</span>
                        </div>
                        <div class="price-container">
                            <span class="retail-price">$${deal.normalPrice}</span>
                            <span class="price-tag">$${deal.salePrice}</span>
                        </div>
                    `;
                    resultsDiv.appendChild(card);
                });
                
            } catch (error) {
                resultsDiv.innerHTML = '<p style="text-align:center; color:#ef4444;">Fehler beim automatischen Laden der Deals.</p>';
                console.error(error);
            }
        };
    </script>
</body>
</html>
