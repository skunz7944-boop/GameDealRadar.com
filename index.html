<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Deal Radar - Vergleich & Top Deals</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #0b1426;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        h1 {
            font-size: 2.3rem;
            color: #38bdf8;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
            margin-bottom: 5px;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
        }
        .section-title {
            width: 100%;
            max-width: 500px;
            font-size: 1.2rem;
            color: #38bdf8;
            margin: 20px 0 10px 0;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 5px;
        }
        .search-box {
            width: 100%;
            max-width: 500px;
            margin-bottom: 15px;
        }
        input {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #1e293b;
            background-color: #1e293b;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .shop-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
            max-width: 500px;
            margin-bottom: 25px;
        }
        .shop-button {
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            text-align: center;
            cursor: pointer;
            border: none;
            color: white;
            transition: transform 0.2s;
        }
        .shop-button:hover {
            transform: scale(1.03);
        }
        .eneba { background-color: #5d1f87; }
        .instant { background-color: #ff5400; }
        .mmoga { background-color: #fdb813; color: #000; }
        .kinguin { background-color: #f25f22; }

        .results-list {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .deal-card {
            background-color: #1e293b;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #334155;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s, border-color 0.2s;
        }
        .deal-card:hover {
            transform: scale(1.02);
            border-color: #38bdf8;
        }
        .deal-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .game-title {
            font-weight: bold;
            font-size: 1rem;
        }
        .savings-badge {
            background-color: #ef4444;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            width: fit-content;
        }
        .price-container {
            text-align: right;
        }
        .retail-price {
            text-decoration: line-through;
            color: #64748b;
            font-size: 0.85rem;
            display: block;
        }
        .price-tag {
            background-color: #22c55e;
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            display: inline-block;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎮 Game Deal Radar</h1>
        <p class="subtitle">Preise vergleichen & automatische Top-Deals abgreifen</p>
    </div>

    <div class="section-title">Live Key-Shops durchsuchen</div>
    <div class="search-box">
        <input type="text" id="gameSearch" placeholder="Spiel eingeben (z.B. GTA)...">
    </div>
    <div class="shop-grid">
        <button class="shop-button eneba" onclick="searchInShop('eneba')">Eneba</button>
        <button class="shop-button instant" onclick="searchInShop('instant')">Instant Gaming</button>
        <button class="shop-button mmoga" onclick="searchInShop('mmoga')">MMOGA</button>
        <button class="shop-button kinguin" onclick="searchInShop('kinguin')">Kinguin</button>
    </div>

    <div class="section-title">Aktuelle Top-Deals im Netz</div>
    <div id="results" class="results-list">
        <p style="text-align:center; color:#94a3b8;">Radar scannt den Markt...</p>
    </div>

    <script>
        // LOGIK 1: Weiterleitung zu den Shops bei Klick
        function searchInShop(shop) {
            const query = encodeURIComponent(document.getElementById('gameSearch').value);
            if (!query) {
                alert("Bitte gib zuerst einen Spielnamen in das Suchfeld ein!");
                return;
            }
            let url = "";
            if (shop === 'eneba') url = `https://www.eneba.com/store/all?text=${query}`;
            if (shop === 'instant') url = `https://www.instant-gaming.com/de/suche/?q=${query}`;
            if (shop === 'mmoga') url = `https://www.mmoga.de/advanced_search_result.php?keywords=${query}`;
            if (shop === 'kinguin') url = `https://www.kinguin.net/de/catalogsearch/result?q=${query}`;
            
            window.open(url, '_blank');
        }

        // LOGIK 2: Automatische API-Abfrage beim Laden der Seite
        window.onload = async function() {
            const resultsDiv = document.getElementById('results');
            try {
                const response = await fetch(`https://www.cheapshark.com/api/1.0/deals?pageSize=10&sortBy=Savings`);
                const deals = await response.json();
                resultsDiv.innerHTML = '';
                
                deals.forEach(deal => {
                    const card = document.createElement('a');
                    card.className = 'deal-card';
                    card.href = `https://www.cheapshark.com/redirect?dealID=${deal.dealID}`;
                    card.target = '_blank';
                    card.innerHTML = `
                        <div class="deal-info">
                            <span class="game-title">${deal.title}</span>
                            <span class="savings-badge">-${Math.round(deal.savings)}%</span>
                        </div>
                        <div class="price-container">
                            <span class="retail-price">$${deal.normalPrice}</span>
                            <span class="price-tag">$${deal.salePrice}</span>
                        </div>
                    `;
                    resultsDiv.appendChild(card);
                });
            } catch (error) {
                resultsDiv.innerHTML = '<p style="text-align:center; color:#ef4444;">Fehler beim Laden der automatischen Deals.</p>';
            }
        };
    </script>
</body>
</html>
